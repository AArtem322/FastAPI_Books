{% extends "base.html" %}
{% block content %}

<section class="page-title">
    <h2>Список книг</h2>
</section>

{% if books %}
    <div class="books-list">
        {% for book in books %}
            {{ book.title }}
            |
        {% endfor %}
    </div>
{% else %}
    <p class="empty">Пока нет книг. Добавь первую</p>
{% endif %}
{% endblock %}
