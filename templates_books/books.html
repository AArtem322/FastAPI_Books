{% extends "base.html" %}
{% block content %}

<section class="page-title">
    <h2>Список книг</h2>
</section>

{% if books %}
    <div class="books-list">
        {% for book in books %}
            <article class="book-card">
                <div>
                    <h3>

                        {% if book.is_read %}
                            <span class="read">✅</span>
                        {% else %}
                            <span class="not-read">❌</span>
                        {% endif %}

                        {{ book.title }}

                    </h3>
                </div>
                <div class="actions">
                    <a class="button secondary" href="/pages/books/{{ book.id }}/edit">Изменить</a>
                </div>
                <form action="/pages/books/{{ book.id }}/delete" method="post">
                    <button type="submit" class="button danger">Удалить</button>
                </form>
            </article>
        {% endfor %}
    </div>
{% else %}
    <p class="empty">Пока нет книг. Добавь первую</p>
{% endif %}
{% endblock %}
